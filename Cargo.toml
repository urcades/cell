[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.52.12"
edition = "2024"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/urcades/cell"

[workspace.dependencies]
anyhow = "1.0.97"
assert_cmd = "2.0.16"
base64 = "0.22.1"
futures = "0.3.31"
globset = "0.4.16"
pin-project-lite = "0.2.16"
reqwest = { version = "0.12.15", default-features = false, features = ["json", "rustls-tls", "stream"] }
regex = "1.11.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = "0.9.34"
shlex = "1.3.0"
similar = "2.6.0"
tempfile = "3.19.0"
thiserror = "2.0.12"
time = { version = "0.3.39", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1.44.1", features = ["macros", "rt-multi-thread", "sync"] }
tokio-stream = "0.1.17"
uuid = { version = "1.16.0", features = ["v4"] }
wait-timeout = "0.2.1"
walkdir = "2.5.0"
